<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav class="box">
            <div class="logo">
                <img src="https://static.cdnlogo.com/logos/p/64/porsche.svg" alt="">
            </div>
            <div class="links">
                <p>highlights</p>
                <p>design</p>
                <p>performance</p>
                <p>charging</p>
                <p>configure</p>
            </div>
            <button>TEST DRIVE</button>
        </nav>
        <section class="box">
            <h1 id="taycan">TAYCAN</h1>
            <div class="cardiv">
                <img src="./assests/car_with_shadow.png" alt="">
            </div>
        </section>
        <footer class="box">
            <div class="name">
                <h2 id="porsche">PORSCHE</h2>
                <p id="dets"><span style="font-weight: 700;">TAYCAN</span> Turbo S</p>
            </div>
            <div class="mid">
                <div>
                    <p>WLTP</p>
                    <h2 style="font-weight: 900;">412km</h2>
                </div>
                <div>
                    <p>0-100KM/h</p>
                    <h2 style="font-weight: 900">2.8s</h2>
                </div>
                <div>
                    <p>HP</p>
                    <h2 style="font-weight: 900">560</h2>
                </div>
            </div>
            <div class="imgdiv">
                <div class="imgbox">
                    <img src="https://i.pinimg.com/736x/11/77/d1/1177d1f70da8774403c389dbe9a6459f.jpg" alt="">
                </div>
                <div class="imgbox">
                    <img src="https://a.storyblok.com/f/329189/1920x1281/cc677d2ac6/ice_grey_taycan_rwd_011_4e9a7891-1.jpeg/m/3840x0/filters:quality(75)" alt="">
                </div>
                <div class="imgbox">
                    <img src="https://a.storyblok.com/f/329189/1280x1080/01ebb8dfaa/porsche-atlanta-perimeter_taycan-26-update_hvp_ls2.jpg/m/3840x0/filters:quality(75)" alt="">
                </div>
            </div>
        </footer>
    </main>
    
</body>
</html>
